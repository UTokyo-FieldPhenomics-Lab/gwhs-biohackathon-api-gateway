# The documentation site. Zensical builds it, .github/workflows/docs.yml publishes it to GitHub
# Pages, and the hand steps behind the domain — the repository's Pages settings and the DNS record —
# are in deploy/README.md §6.
#
# This file sits at the repository root because Zensical resolves `docs_dir` and `site_dir` relative
# to the config file, and .gitignore already ignores the `site/` that the second one produces.
#
# docs_dir points at docs/content and not at docs on purpose: docs/ is the subproject, so it holds
# this site's pyproject.toml, its uv.lock, and its .venv. A virtualenv anywhere under docs_dir stops
# the build emitting site/assets entirely — the pages come out unstyled and nothing warns — which is
# why the content root holds site material and nothing else. The runbook that would otherwise be a
# second README lives in deploy/README.md.

[project]
site_url = "https://docs.global-wheat.com/"
site_name = "Global Wheat BioHackathon API"
site_description = "Dataset and model API for the global wheat BioHackathon, Göttingen, 7-11 December 2026."

# Both relative to this file, which is why the site is never built from a config inside docs/content.
docs_dir = "docs/content"
site_dir = "site"

repo_url = "https://github.com/UTokyo-FieldPhenomics-Lab/gwhs-biohackathon-api-gateway"
repo_name = "UTokyo-FieldPhenomics-Lab/gwhs-biohackathon-api-gateway"
edit_uri = "edit/main/docs/content/"

# The framed API pages need one file: it sizes each frame and passes the reader's palette into it. It
# lives in `docs/content/api/`, beside the pages that use it.
extra_javascript = ["api/frame.js"]

# The interactive reference is an external link rather than a generated section: it is FastAPI's own
# Swagger UI on the API host, which needs no renderer here and cannot be a static page. Every page
# here is written for a participant — the internal contract (index fields, S3 layout) lives outside
# docs/content and is never published.
nav = [
  { "Start here" = "index.md" },
  { "Calling the API" = [
      { "Calling the API" = "api/index.md" },
      { "Raw HTTP" = "api/http.md" },
      { "Base API reference" = "api/reference.md" },
      { "Clients" = "api/clients.md" },
  ] },
  { "Datasets" = [
      { "Datasets" = "datasets/index.md" },
      { "gwhd" = "datasets/gwhd.md" },
      { "gwfss" = "datasets/gwfss.md" },
      { "gwhs" = "datasets/gwhs.md" },
  ] },
  { "Models" = [
      { "Models" = "models/index.md" },
      { "sam3.1-meta" = "models/sam3.1-meta.md" },
  ] },
  { "Examples" = [
      { "Live demo" = "examples/demo.md" },
      { "Jupyter quickstart" = "examples/quickstart.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins]
# Zensical copies every non-markdown file under docs_dir into the site, so a cache that appears there
# is published as an asset. The examples' .py/.js/.kt files are deliberately NOT excluded: the
# examples page links to them so a reader can download the snippet it shows.
exclude = { glob = ["**/__pycache__/**"] }

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
