<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run one model — Global Wheat API</title>
<style>
__PLAY_CSS__
</style>
</head>
<body>
<main id="play">
  <h1>Run one model</h1>

  <form id="connect" class="row" autocomplete="off">
    <label for="key">Your key</label>
    <input id="key" name="key" type="password" autocomplete="off" spellcheck="false"
           placeholder="X-API-Key" aria-describedby="connect-state">
    <span class="key-buttons">
      <button type="submit">Use key</button>
      <button id="forget" type="button">Forget</button>
    </span>
    <span id="connect-state" class="state" role="status"></span>
  </form>

  <div class="row">
    <label for="source">Image</label>
    <select id="source">
      <option value="row">a published row</option>
      <option value="upload">your own photograph</option>
    </select>
    <span id="row-choice">
      <select id="dataset" disabled aria-label="dataset"></select>
      <input id="row" type="number" min="0" step="1" value="0" disabled aria-label="row number">
    </span>
    <input id="file" type="file" accept="image/*" hidden aria-label="your photograph">
    <label id="resize-choice" hidden><input id="resize" type="checkbox" checked> resize before sending</label>
  </div>

  <div class="row">
    <label for="model">Model</label>
    <select id="model" disabled></select>
    <span id="model-state" class="state" role="status"></span>
  </div>

  <div class="row" id="parameters-row">
    <span class="legend" id="parameters-legend" hidden>Parameters</span>
    <span id="parameters"></span>
    <button id="boxes-mode" type="button" class="toggle" aria-pressed="true" hidden>edit</button>
    <button id="run" type="button" class="primary" disabled>Run</button>
    <span id="run-state" class="state" role="status"></span>
  </div>

  <figure hidden>
    <figcaption>
      <span class="caption">
        <span id="count" hidden></span>
        <span id="check"></span>
      </span>
      <span id="display">
        <button type="button" class="eye" data-view="masks" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>masks</span>
        </button>
        <button type="button" class="eye" data-view="boxes" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>boxes</span>
        </button>
        <button type="button" class="eye" data-view="legend" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>legend</span>
        </button>
        <button type="button" class="eye" data-view="watermark" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>watermark</span>
        </button>
        <a id="full" href="" target="_blank" rel="noopener" hidden>raw image ↗</a>
      </span>
    </figcaption>
    <div id="pane">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="marks"></div>
        <div id="boxes"></div>
      </div>
      <div id="legend" hidden></div>
      <div id="watermark" hidden></div>
    </div>
  </figure>

  <details id="request" hidden>
    <summary>The equivalent curl</summary>
    <p class="note">The call this page makes, with your key left as <code>$KEY</code> — the page never
      prints it.</p>
    <pre id="request-body"></pre>
  </details>

  <details id="response" hidden>
    <summary>The response body</summary>
    <pre id="response-body"></pre>
  </details>
</main>
<!-- Three modules, in this order: a module is deferred and runs after the document is parsed, so the
     decoder has run by the time the page asks it to draw. They have to be modules: the client is an
     ES module and a classic <script> cannot parse its `export`, which is how this page once loaded a
     decoder that never ran. -->
<script type="module" src="__DECODER__"></script>
<script type="module">
__API_KEY_JS__
</script>
<script type="module">
__PLAY_JS__
</script>
__REPORTER__
</body>
</html>
