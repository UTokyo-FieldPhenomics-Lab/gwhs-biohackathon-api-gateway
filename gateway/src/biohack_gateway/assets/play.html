<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run one model — Global Wheat API</title>
<style>
__PLAY_CSS__
</style>
</head>
<body>
<main id="play">
  <h1>Run one model</h1>

  <div id="form">
    <form id="connect" class="row" autocomplete="off">
      <label for="key">Your key</label>
      <span class="controls">
        <input id="key" name="key" type="password" autocomplete="off" spellcheck="false"
               placeholder="X-API-Key" aria-describedby="connect-state">
        <span class="key-buttons">
          <button type="submit">Use key</button>
          <button id="forget" type="button">Forget</button>
        </span>
        <span id="connect-state" class="state" role="status"></span>
      </span>
    </form>

    <div class="row">
      <label for="source">Image</label>
      <span class="controls">
        <select id="source">
          <option value="row">a published row</option>
          <option value="upload">your own photograph</option>
        </select>
        <span id="row-choice">
          <select id="dataset" disabled aria-label="dataset"></select>
          <input id="row" type="number" min="0" step="1" value="0" disabled aria-label="row number">
        </span>
        <input id="file" type="file" accept="image/*" hidden aria-label="your photograph">
        <label id="resize-choice" hidden><input id="resize" type="checkbox" checked> resize before sending</label>
      </span>
    </div>

    <div class="row">
      <label for="model">Model</label>
      <span class="controls">
        <select id="model" disabled></select>
        <select id="variant" hidden aria-label="checkpoint"></select>
        <span id="model-state" class="state" role="status"></span>
      </span>
    </div>

    <div class="row" id="examples-row" hidden>
      <span class="legend">Examples</span>
      <span class="controls" id="examples"></span>
    </div>

    <span id="parameters"></span>

    <!-- Whether the picture's geometry answers to the mouse. The script moves this into a geometry
         parameter's own row, beside the list it switches, and clones it for the second list, so it
         lives here only as the one place it is written; a model that declares no geometry keeps it
         out of the document. Each state is an icon and a word: the word stays while the row has room
         for it, and the icon is what is left when it does not, so the switch never moves to a line
         of its own. -->
    <span id="boxes-mode" class="switch mode-switch" role="group" aria-label="boxes on the picture" hidden>
      <button type="button" data-mode="edit" aria-pressed="true" aria-label="edit"
              title="draw boxes on the picture">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3.5 16.5l.8-3.6 8.6-8.6a1.6 1.6 0 0 1 2.3 0l1.1 1.1a1.6 1.6 0 0 1 0 2.3l-8.6 8.6z"/>
          <path d="M12.2 5.4l2.4 2.4"/>
        </svg>
        <span class="mode-label">edit</span>
      </button>
      <button type="button" data-mode="locked" aria-pressed="false" aria-label="locked"
              title="the picture is read-only; the list still edits">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <rect x="4.5" y="9" width="11" height="7.5" rx="1"/>
          <path d="M7 9V6.5a3 3 0 0 1 6 0V9"/>
        </svg>
        <span class="mode-label">locked</span>
      </button>
    </span>

    <span id="run-row">
      <button id="run" type="button" class="primary" disabled>Run</button>
      <span id="run-state" class="state" role="status"></span>
    </span>
  </div>

  <figure hidden>
    <figcaption>
      <span class="caption">
        <span id="count" hidden></span>
        <span id="check"></span>
      </span>
      <span id="display">
        <button type="button" class="eye" data-view="image" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>image</span>
        </button>
        <button type="button" class="eye" data-view="masks" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>masks</span>
        </button>
        <button type="button" class="eye" data-view="results" aria-pressed="false" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>results</span>
        </button>
        <button type="button" class="eye" data-view="geometry" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>geometry</span>
        </button>
        <button type="button" class="eye" data-view="legend" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>legend</span>
        </button>
        <button type="button" class="eye" data-view="watermark" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2 10c2.2-3.2 4.9-5 8-5s5.8 1.8 8 5c-2.2 3.2-4.9 5-8 5s-5.8-1.8-8-5Z"/>
            <circle cx="10" cy="10" r="2.5"/>
            <path class="slash" d="M3.2 16.8 16.8 3.2"/>
          </svg>
          <span>watermark</span>
        </button>
        <a id="full" href="" target="_blank" rel="noopener" hidden>raw image ↗</a>
      </span>
    </figcaption>
    <div id="pane">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="marks"></div>
        <div id="boxes"></div>
        <div id="points" aria-hidden="true"></div>
      </div>
      <div id="legend" hidden></div>
      <div id="watermark" hidden></div>
    </div>
    <details id="answer" hidden>
      <summary>Answer</summary>
      <p id="answer-text"></p>
    </details>
  </figure>

  <details id="request" hidden>
    <summary>The equivalent curl</summary>
    <p class="note">The call this page makes, with your key left as <code>$KEY</code> — the page never
      prints it.</p>
    <pre id="request-body"></pre>
  </details>

  <details id="response" hidden>
    <summary>The response body</summary>
    <pre id="response-body"></pre>
  </details>
</main>
<!-- Three modules, in this order: a module is deferred and runs after the document is parsed, so the
     decoder has run by the time the page asks it to draw. They have to be modules: the client is an
     ES module and a classic <script> cannot parse its `export`, which is how this page once loaded a
     decoder that never ran. -->
<script type="module" src="__DECODER__"></script>
<script type="module">
__API_KEY_JS__
</script>
<script type="module">
__PLAY_JS__
</script>
__REPORTER__
</body>
</html>
