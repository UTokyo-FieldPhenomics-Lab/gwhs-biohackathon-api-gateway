[project]
name = "biohack-datasets"
version = "0.1.0"
description = "Publisher that builds and syncs the CDN-ready static dataset layout for the Global Wheat datasets."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pillow>=10.3",
    "pyarrow>=17",
    "pyyaml>=6",
]

[project.scripts]
biohack-datasets = "biohack_datasets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biohack_datasets"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
