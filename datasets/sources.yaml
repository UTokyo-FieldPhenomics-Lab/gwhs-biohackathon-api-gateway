# Provenance for every dataset the publisher consumes.
#
# This file is the source of truth for adapters, upstream locations, and licenses. Every
# version published to S3 must be traceable back to this file. Fill in the fields below
# before the first real publish; `license` must be cleared before any dataset is distributed
# publicly. Record an immutable revision in `upstream` (for example an HF commit id) rather
# than a checksum: this repository computes and stores no content hash.
#
# One dataset id per upstream; a preliminary release gets its own id so a later full release
# never renumbers an address that is already in use. `adapter` names the reader for a schema,
# not a dataset: `gwhs` and `gwhs-temp` share one.
#
# `include` selects what `biohack-datasets-fetch` downloads from the pinned revision, as glob
# patterns over repository-relative paths. The default, used when the key is absent, is
# `data/*.parquet`. Upstreams keep archives and cards at the repository root; no pattern here
# reaches them, and that is the whole reason the key exists.

datasets:
  gwhd:
    adapter: gwhd          # image + bounding-box annotations
    upstream: Etienne-David/GlobalWheatHeadDataset2021@d223a227ee21fca3dbab9605d3fbcdcc2e33abc5
    license: cc-by-4.0     # as declared by the upstream dataset card
  gwfss:
    adapter: gwfss         # image + semantic mask annotations
    upstream: GlobalWheat/GWFSS_v1.0@d32eb4a70811fa4107000e0b8821e892df710830
    include: ["data/labelled-*.parquet"]   # its all/full files are byte-identical to labelled
    license: cc-by-4.0     # as declared by the upstream dataset card
  gwhs-temp:
    adapter: gwhs          # development-only sample of the GWHS schema
    upstream: GWHS/sample_dataset@655118534e9ad980b6f7c0dd6566a406d5a29a27
    license: null          # TODO: the sample's card declares no license
  gwhs:
    adapter: gwhs          # image + object-level RLE and labels
    upstream: null         # TODO: pin when the full annotation is released
    license: null          # TODO: redistribution terms to verify
